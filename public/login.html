
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Samity Manager</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f3;--panel:#fff;--ink:#10201c;--mute:#5d706a;--line:#dce5e1;--brand:#0a6b52;--bi:#fff;--red:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0b1411;--panel:#121d19;--ink:#e6efeb;--mute:#8aa098;--line:#22332d;--brand:#3ecf9f;--bi:#06251b;--red:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.55 'Hind Siliguri',system-ui,sans-serif}
.card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.brand{display:flex;align-items:center;gap:10px;font:700 20px 'Bricolage Grotesque',sans-serif;margin-bottom:22px}
.brand i{width:26px;height:26px;border-radius:50% 50% 50% 8px;background:var(--brand)}
h1{font:700 28px 'Bricolage Grotesque',sans-serif;margin:0 0 6px}
p{margin:0 0 20px;color:var(--mute)}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.pw{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button{font:inherit;font-weight:600;border-radius:10px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
#eye{border:1px solid var(--line);background:none;color:var(--ink);padding:0 14px}
#go{width:100%;margin-top:16px;padding:11px;border:0;background:var(--brand);color:var(--bi)}
#go:disabled{opacity:.6}
#err{min-height:22px;margin-top:8px;color:var(--red);font-size:14px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand"><i></i>Samity</div>
  <h1>Sign in</h1>
  <p>Enter the admin password to manage members, loans and collections.</p>
  <form id="f">
    <label for="pw">Password</label>
    <div class="pw">
      <input type="password" id="pw" required autofocus autocomplete="current-password">
      <button type="button" id="eye" aria-label="Show or hide password">Show</button>
    </div>
    <div id="err" role="alert"></div>
    <button id="go">Sign in</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
$('eye').onclick = () => {
  const hidden = $('pw').type === 'password';
  $('pw').type = hidden ? 'text' : 'password';
  $('eye').textContent = hidden ? 'Hide' : 'Show';
};
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  $('go').disabled = true;
  $('err').textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value }),
    });
    if (res.ok) { location.href = '/'; return; }
    $('err').textContent = (await res.json()).error || 'Could not sign in.';
  } catch (err) {
    $('err').textContent = 'Cannot reach the server. Is it running?';
  }
  $('card').classList.remove('shake');
  void $('card').offsetWidth;
  $('card').classList.add('shake');
  $('go').disabled = false;
  $('pw').select();
});
</script>
</body>
</html>
